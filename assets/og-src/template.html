<!doctype html>
<!-- Source for assets/og.png (English) and assets/og-ko.png (Korean). 1200x630.
     Regenerate: node assets/og-src/render.mjs   (needs Google Chrome; Pretendard loads from jsDelivr).
     2026-11-26: matches the v3 home (white ground, the Now card from the hero phone, the hero headline). Key content stays in the middle so ~2:1 crops keep it. -->
<html>
<head>
<meta charset="utf-8">
<title>one-by.one share image</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin="anonymous">
<style>
  :root { --page:#fff; --ink:#17181b; --card:#1c1c1e; --lime:#c6ef4e; --muted:#5b6068; --line:#e6e8ea; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--page); }
  body { position: relative; font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink); text-align: center; }
  .ticket { position: absolute; left: 330px; top: 44px; width: 540px; height: 266px; border-radius: 34px; background: var(--card); color: #fff; text-align: left; padding: 30px 34px; box-shadow: 0 24px 50px rgba(23,24,27,.16); }
  .t-title { font-size: 34px; font-weight: 700; letter-spacing: -.6px; }
  .t-clock { margin-top: 2px; font-size: 92px; font-weight: 700; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .pill { position: absolute; left: 22px; right: 22px; bottom: 22px; height: 66px; border-radius: 33px; background: #2c2c2f; }
  .pill b { position: absolute; left: 6px; top: 6px; bottom: 6px; width: 148px; border-radius: 27px; background: var(--lime); color: var(--ink); font-size: 26px; font-weight: 700; line-height: 54px; text-align: center; }
  .pill i { position: absolute; right: 8px; top: 8px; width: 50px; height: 50px; border-radius: 50%; background: #17181b; }
  .pill i svg { position: absolute; inset: 13px; }
  .headline { position: absolute; left: 0; right: 0; top: 352px; font-size: 76px; line-height: 1.08; font-weight: 800; letter-spacing: -2.6px; word-break: keep-all; }
  html[lang=ko] .headline { font-size: 64px; letter-spacing: -2px; line-height: 1.16; }
  .brand { position: absolute; left: 0; right: 0; top: 560px; font-size: 26px; font-weight: 700; letter-spacing: -.8px; }
  .brand i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); margin-right: 10px; vertical-align: 1px; box-shadow: 0 0 0 1px #A9CE36; }
  html[lang=ko] .en, html[lang=en] .ko { display: none; }
</style>
</head>
<body>
<div class="ticket" aria-hidden="true">
  <p class="t-title"><span class="en">Build the deck</span><span class="ko">발표 자료 만들기</span></p>
  <p class="t-clock">25:00</p>
  <div class="pill"><b><span class="en">Done</span><span class="ko">완료</span></b><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></div>
</div>
<div class="headline"><span class="en">Your AI plans.<br>You just do.</span><span class="ko">AI가 하루를 짜고,<br>폰은 지금 할 일 한 장만.</span></div>
<div class="brand"><i></i>one-by.one</div>
<script>
  const l = new URLSearchParams(location.search).get("lang") === "ko" ? "ko" : "en";
  document.documentElement.lang = l;
</script>
</body>
</html>
